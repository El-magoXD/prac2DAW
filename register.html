<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrarse</title>
  </head>
  <body>
    <header>
      <h1>PI - Pisos e Inmuebles</h1>

      <nav>
        <ul>
          <li><a href="index.html">Página principal</a></li>
          <li><a href="search.html">Buscar</a></li>
          <li><a href="register.html">Registrarse</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Registro de nuevo usuario</h2>
      <form action="index-reg.html" method="get">
        <fieldset>
          <legend>Datos de acceso</legend>
          <p>
            <label for="usuario">Nombre de usuario:</label>
            <input type="text" id="usuario" name="usuario" />
          </p>
          <p>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" />
          </p>
          <p>
            <label for="password2">Repetir contraseña:</label>
            <input type="password" id="password2" name="password2" />
          </p>
          <p>
            <label for="email">Dirección de email:</label>
            <input type="email" id="email" name="email" />
          </p>
        </fieldset>
        <fieldset>
          <legend>Datos personales</legend>
          <p><span>Sexo:</span></p>
          <p>
            <input type="radio" id="hombre" name="sexo" value="hombre" />
            <label for="hombre">Hombre</label>
          </p>
          <p>
            <input type="radio" id="mujer" name="sexo" value="mujer" />
            <label for="mujer">Mujer</label>
          </p>
          <p>
            <input type="radio" id="otro" name="sexo" value="otro" />
            <label for="otro">Otro</label>
          </p>
          <p>
            <label for="fecha-nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" />
          </p>
          <p>
            <label for="ciudad">Ciudad de residencia:</label>
            <input type="text" id="ciudad" name="ciudad" />
          </p>
          <p>
            <label for="pais">País de residencia:</label>
            <select id="pais" name="pais">
              <option value="">Selecciona un país</option>
              <option value="espana">España</option>
              <option value="francia">Francia</option>
              <option value="italia">Italia</option>
              <option value="alemania">Alemania</option>
              <option value="portugal">Portugal</option>
              <option value="paises-bajos">Países Bajos</option>
              <option value="belgica">Bélgica</option>
              <option value="irlanda">Irlanda</option>
              <option value="reino-unido">Reino Unido</option>
              <option value="estados-unidos">Estados Unidos</option>
            </select>
          </p>
          <p>
            <label for="foto">Foto:</label>
            <input type="file" id="foto" name="foto" accept="image/*" />
          </p>
        </fieldset>
        <p>
          <button type="submit">Registrarse</button>
          <button type="reset">Limpiar formulario</button>
        </p>
      </form>
    </main>

    <footer>
      <p>Pedro González Sánchez & Alejandro Sánchez Martí</p>
      <p>&copy; 2026 PI - Pisos e Inmuebles. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
