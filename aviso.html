<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

  <body>
    <header>
      <h1>PI - Pisos e Inmuebles</h1>

      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="search.html">Buscar anuncios</a></li>
          <li><a href="register.html">Registrarse</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Acceso restringido</h2>

      <p>
        Para poder consultar el detalle de este anuncio debes iniciar sesión.
      </p>

      <section>
        <h2>Iniciar sesión</h2>

        <form action="index-reg.html" method="get">
          <p>
            <label for="usuario">Nombre de usuario:</label>
            <input type="text" id="usuario" name="usuario" />
          </p>

          <p>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" />
          </p>

          <p>
            <button type="submit">Entrar</button>
          </p>
        </form>
      </section>

      <p>
        ¿Todavía no tienes una cuenta?
        <a href="register.html">Regístrate aquí</a>.
      </p>
    </main>

    </footer>
